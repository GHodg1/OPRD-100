name: Score Submission

on:
  pull_request:
    paths:
      - 'data/submissions/**'
    types: [opened, synchronize]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    # Require file validation to pass before running scoring
    needs: []
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    
    # Security: Set timeout to prevent runaway processes
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Verify only submissions folder modified
        run: |
          # Double-check that only data/submissions/ files were modified
          git fetch origin ${{ github.base_ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          
          echo "Checking changed files..."
          INVALID=0
          while IFS= read -r file; do
            if [ -n "$file" ] && [[ ! "$file" =~ ^data/submissions/ ]]; then
              echo "❌ Unauthorized file modification detected: $file"
              INVALID=1
            fi
          done <<< "$CHANGED_FILES"
          
          if [ $INVALID -eq 1 ]; then
            echo ""
            echo "ERROR: This PR modifies files outside data/submissions/"
            echo "Scoring will not proceed for security reasons."
            exit 1
          fi
          
          echo "✅ Verification passed: Only submission files modified"
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r requirements-ci.txt
      
      - name: Security - Validate submission file path
        id: validate_path
        run: |
          # Only allow JSON files in data/submissions/
          SUBMISSION_FILE=$(find data/submissions -name "*.json" -type f ! -name "example_submission.json" ! -name "time_test_submission.json" | head -1)
          
          if [ -z "$SUBMISSION_FILE" ]; then
            echo "❌ No valid submission file found"
            exit 1
          fi
          
          # Verify path is within data/submissions/
          if [[ ! "$SUBMISSION_FILE" =~ ^data/submissions/[^/]+\.json$ ]]; then
            echo "❌ Invalid submission path: $SUBMISSION_FILE"
            echo "Submissions must be directly in data/submissions/ directory"
            exit 1
          fi
          
          # Check file size (max 10MB)
          FILE_SIZE=$(stat -c%s "$SUBMISSION_FILE" 2>/dev/null || stat -f%z "$SUBMISSION_FILE")
          MAX_SIZE=$((10 * 1024 * 1024))
          if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "❌ File too large: $FILE_SIZE bytes (max 10MB)"
            exit 1
          fi
          
          echo "✅ Path validation passed: $SUBMISSION_FILE"
          echo "submission_file=$SUBMISSION_FILE" >> $GITHUB_OUTPUT
      
      - name: Extract submitter name
        id: get_name
        run: |
          SUBMISSION_FILE="${{ steps.validate_path.outputs.submission_file }}"
          
          # Validate JSON syntax before parsing
          if ! python -c "import json; json.load(open('$SUBMISSION_FILE'))" 2>/dev/null; then
            echo "❌ Invalid JSON file"
            exit 1
          fi
          
          SUBMITTER_NAME=$(python -c "import json; print(json.load(open('$SUBMISSION_FILE'))['submitter_name'])")
          
          # Sanitize submitter name (alphanumeric, spaces, hyphens, underscores only)
          SUBMITTER_NAME=$(echo "$SUBMITTER_NAME" | tr -cd '[:alnum:] _-' | cut -c1-50)
          
          if [ -z "$SUBMITTER_NAME" ]; then
            echo "❌ Invalid submitter_name"
            exit 1
          fi
          
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          OUTPUT_DIR="results/${SUBMITTER_NAME}_${TIMESTAMP}"
          echo "output_dir=$OUTPUT_DIR" >> $GITHUB_OUTPUT
          echo "submitter_name=$SUBMITTER_NAME" >> $GITHUB_OUTPUT
          echo "submission_file=$SUBMISSION_FILE" >> $GITHUB_OUTPUT
      
      - name: Create output directory
        run: |
          mkdir -p ${{ steps.get_name.outputs.output_dir }}
      
      - name: Run scoring
        id: run_scoring
        run: |
          # Set resource limits
          ulimit -v 4000000  # 4GB virtual memory limit
          ulimit -t 1800     # 30 minutes CPU time limit

          # Submissions are scored with the lenient (content-based) method — the
          # primary leaderboard track for automated extraction. Strict scoring is
          # reserved for the human re-extraction validation and is not run here.
          timeout 25m python scripts/run_scoring.py --lenient \
            --submission-file ${{ steps.get_name.outputs.submission_file }} \
            --output-dir ${{ steps.get_name.outputs.output_dir }}
        continue-on-error: true
      
      - name: Check scoring success
        run: |
          if [ ${{ steps.run_scoring.outcome }} != 'success' ]; then
            echo "❌ Scoring failed or was terminated"
            echo "This may be due to:"
            echo "  - Security validation failure"
            echo "  - Invalid submission format"
            echo "  - Resource limits exceeded"
            echo "  - Processing timeout"
            exit 1
          fi
      
      - name: Extract scores
        id: extract_scores
        run: |
          python scripts/extract_scores.py --mode lenient \
            --results-dir ${{ steps.get_name.outputs.output_dir }} \
            --output ${{ steps.get_name.outputs.output_dir }}/scores.json
          
          # Read scores for later use
          SCORES=$(cat ${{ steps.get_name.outputs.output_dir }}/scores.json)
          echo "scores<<EOF" >> $GITHUB_OUTPUT
          echo "$SCORES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Update leaderboard
        run: |
          python scripts/update_leaderboard.py --mode lenient \
            --submitter "${{ steps.get_name.outputs.submitter_name }}" \
            --scores-file ${{ steps.get_name.outputs.output_dir }}/scores.json \
            --pr-number ${{ github.event.pull_request.number }}

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ steps.get_name.outputs.output_dir }}
          git add README.md
          git add leaderboard_lenient.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add scoring results for ${{ steps.get_name.outputs.submitter_name }}"
            git push
          fi
      
      - name: Comment on PR
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const scoresPath = '${{ steps.get_name.outputs.output_dir }}/scores.json';
            const s = JSON.parse(fs.readFileSync(scoresPath, 'utf8'));

            const comment = `## 🎯 Scoring Results

            Thank you for your submission, **${{ steps.get_name.outputs.submitter_name }}**!

            Scored with the **lenient (content-based)** method — the primary leaderboard track for automated extraction.

            ### Results Summary
            | Score (Quality×Coverage) | Quality | Coverage | Experimental | Table | Scheme | Matched |
            |--------------------------|---------|----------|--------------|-------|--------|---------|
            | ${s.combined_mean_covered.toFixed(3)} | ${s.combined_mean.toFixed(3)} | ${(s.coverage * 100).toFixed(1)}% | ${s.exp_mean.toFixed(3)} | ${s.table_mean.toFixed(3)} | ${s.scheme_mean.toFixed(3)} | ${s.num_matched}/${s.num_gold} |

            - **Score** = Quality × Coverage (headline ranking metric)
            - **Quality** = mean per-reaction similarity over matched reactions
            - **Coverage** = fraction of ground-truth reactions matched in the papers you attempted

            📊 Results saved to: \`${{ steps.get_name.outputs.output_dir }}\`

            Check out the full leaderboard in the [README](../blob/main/README.md#-leaderboard--automated-extraction-ai--ocsr)!
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
