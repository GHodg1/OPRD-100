name: Score Submission

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions: {}

concurrency:
  group: scoring-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      is_submission: ${{ steps.prepare.outputs.is_submission }}
    steps:
      # Never check out a submitter's branch in this workflow.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select and download the changed submission
        id: prepare
        uses: actions/github-script@v7
        with:
          script: |
            const workflow = require('./.github/scripts/submissions.cjs');
            await workflow.prepare({github, context, core});

      - uses: actions/setup-python@v5
        if: steps.prepare.outputs.is_submission == 'true'
        with:
          python-version: '3.12'

      - name: Install scoring dependencies
        if: steps.prepare.outputs.is_submission == 'true'
        run: python -m pip install -r requirements-ci.txt

      - name: Score and prepare publication
        if: steps.prepare.outputs.is_submission == 'true'
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          ulimit -v 4000000
          ulimit -t 1500
          timeout 25m python scripts/run_scoring.py --lenient \
            --submission-file "$RUNNER_TEMP/oprd-scoring/submission.json" \
            --output-dir "$RUNNER_TEMP/oprd-scoring/results"
          python scripts/extract_scores.py --mode lenient \
            --results-dir "$RUNNER_TEMP/oprd-scoring/results" \
            --output "$RUNNER_TEMP/oprd-scoring/results/scores.json"
          python scripts/submission_workflow.py summarize \
            --directory "$RUNNER_TEMP/oprd-scoring"

      - name: Upload score summary and diagnostics
        if: steps.prepare.outputs.is_submission == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: submission-score
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/oprd-scoring/publication.json
            ${{ runner.temp }}/oprd-scoring/results/lenient_scores.json
            ${{ runner.temp }}/oprd-scoring/results/lenient_matches.csv

  publish:
    needs: evaluate
    if: needs.evaluate.outputs.is_submission == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: submission-score
          path: ${{ runner.temp }}/oprd-scoring

      - name: Verify the current PR and publication data
        run: |
          python scripts/submission_workflow.py validate \
            --directory "$RUNNER_TEMP/oprd-scoring"

      - name: Check whether this result is still current
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const workflow = require('./.github/scripts/submissions.cjs');
            await workflow.gate({github, context, core});

      - name: Update the leaderboard only after merge
        if: steps.gate.outputs.publish_leaderboard == 'true'
        run: |
          python scripts/submission_workflow.py publish \
            --directory "$RUNNER_TEMP/oprd-scoring"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- README.md leaderboard_lenient.json
          if ! git diff --cached --quiet; then
            git commit -m "Update automated extraction leaderboard"
            git push origin HEAD:main
          fi

      - name: Post or update the score comment
        if: steps.gate.outputs.current == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const workflow = require('./.github/scripts/submissions.cjs');
            await workflow.comment({github, context, core});
