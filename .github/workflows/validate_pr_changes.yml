name: Validate PR File Changes

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate submission PRs without blocking maintenance
        uses: actions/github-script@v7
        with:
          script: |
            const {selectSubmission} = require('./.github/scripts/submissions.cjs');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: context.issue.number, per_page: 100,
            });
            const submission = selectSubmission(files);
            core.info(submission
              ? `Submission selected: ${submission.filename}`
              : 'Maintenance PR: no participant submission to score.');
